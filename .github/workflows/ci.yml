name: Verify Text to Learn
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run inspect:production
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: |
            playwright-report/
            test-results/
            docs/weeks/week-4/accessibility/
            docs/weeks/week-4/production-ui.json
          if-no-files-found: ignore
          retention-days: 14
